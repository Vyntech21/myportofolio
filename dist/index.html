<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio</title>
<style>
:root{--bg:#fafaf7;--fg:#16161a;--mut:#6b6b76;--card:#fff;--bd:#e6e6e0;--ac:#e4572e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--fg:#f2f2f5;--mut:#9a9aa6;--card:#18181d;--bd:#2a2a31}}
:root[data-theme="dark"]{--bg:#0f0f12;--fg:#f2f2f5;--mut:#9a9aa6;--card:#18181d;--bd:#2a2a31}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit;text-decoration:none}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--bd)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
nav b{font-size:17px}
nav div a{margin-left:18px;color:var(--mut);font-size:14px}
nav div a:hover{color:var(--ac)}
section{padding:72px 0 8px}
h1{font-size:clamp(34px,7vw,60px);line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac);margin:0 0 20px}
.role{font-size:20px;color:var(--mut);margin:0 0 10px}
.lead{max-width:600px;color:var(--mut);font-size:18px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-weight:600;cursor:pointer;font-size:15px;color:var(--fg)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card h3{margin:6px 0}
.card p{color:var(--mut);margin:0 0 10px;font-size:15px}
.tag{font-size:12px;color:var(--ac);font-weight:700}
.form{display:grid;gap:10px;max-width:480px}
.form input,.form textarea,.panel input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}
footer{padding:40px 0;color:var(--mut);font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px}
.fab .btn{box-shadow:0 4px 16px rgba(0,0,0,.2)}
.panel{display:none;position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));max-height:60vh;overflow:auto;z-index:20;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.panel label{font-size:12px;color:var(--mut);display:block;margin-top:6px}
body.edit .panel{display:block}
body.edit [contenteditable]{outline:1px dashed var(--ac);outline-offset:3px;border-radius:4px;cursor:text}
.x{display:none;margin-left:6px;cursor:pointer;color:var(--ac);font-weight:700}
body.edit .x{display:inline}
.add{display:none}
body.edit .add{display:inline-block;margin-top:12px}
</style>
</head>
<body>
<nav><div class="wrap"><span style="display:flex;align-items:center;gap:10px"><img id="logoimg" alt="Logo"><b id="logo"></b></span><div><a href="#tentang">Tentang</a><a href="#proyek">Proyek</a><a href="#kontak">Kontak</a></div></div></nav>
<main class="wrap" id="app"></main>
<div class="panel" id="panel"></div>

<script>
/* ====== EDIT ISI DI SINI (atau klik tombol "✎ Edit" di web) ====== */
const DEFAULT = {
  name: "M.Arkan Al-faruq",
  role: "Web Developer & Desainer",
  tagline: "Saya membuat produk digital yang cepat, rapi, dan mudah dipakai.",
  about: "Tulis cerita singkat tentang diri Anda di sini: latar belakang, pengalaman, dan apa yang Anda cari. Klik tombol Edit untuk mengubahnya langsung.",
  accent: "#e4572e",
  skills: ["HTML & CSS", "Lua", "UI Design", "DevRoblox", ""],
  projects: [
    {tag: "WEB APP", title: "Proyek Pertama", desc: "Deskripsi singkat proyek dan hasil yang dicapai.", link: "#"},
    {tag: "WEBSITE", title: "Proyek Kedua", desc: "Deskripsi singkat proyek dan hasil yang dicapai.", link: "#"},
    {tag: "MOBILE", title: "Proyek Ketiga", desc: "Deskripsi singkat proyek dan hasil yang dicapai.", link: "#"}
  ],
  contact: {
    wa: "6283184909031",           /* nomor WhatsApp tanpa + atau 0 di depan */
    email: "pxlglora@gmail.com",
    instagram: "pxlglora",
  }
};
/* ================================================================= */

const KEY = "portfolio_v1";
let C = JSON.parse(JSON.stringify(DEFAULT));
try { const s = localStorage.getItem(KEY); if (s) C = JSON.parse(s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(C)); } catch (e) {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const $ = s => document.querySelector(s);
const get = (p) => p.split(".").reduce((o, k) => o?.[k], C);
const set = (p, v) => { const a = p.split("."), l = a.pop(); a.reduce((o, k) => o[k], C)[l] = v; };

function links() {
  const c = C.contact, L = [];
  if (c.wa) L.push(`<a class="btn p" target="_blank" rel="noopener" href="https://wa.me/${esc(c.wa)}">WhatsApp</a>`);
  if (c.email) L.push(`<a class="btn" href="mailto:${esc(c.email)}">Email</a>`);
  if (c.instagram) L.push(`<a class="btn" target="_blank" rel="noopener" href="https://instagram.com/${esc(c.instagram)}">Instagram</a>`);
  if (c.linkedin) L.push(`<a class="btn" target="_blank" rel="noopener" href="https://linkedin.com/in/${esc(c.linkedin)}">LinkedIn</a>`);
  if (c.github) L.push(`<a class="btn" target="_blank" rel="noopener" href="https://github.com/${esc(c.github)}">GitHub</a>`);
  return L.join("");
}

function render() {
  document.documentElement.style.setProperty("--ac", C.accent);
  $("#logo").textContent = C.name;
  $("#app").innerHTML = `
  <section id="beranda" style="padding-top:90px;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap">
  <div style="flex:1;min-width:280px">
    <p class="role" data-p="role">${esc(C.role)}</p>
    <h1 data-p="name">${esc(C.name)}</h1>
    <p class="lead" data-p="tagline">${esc(C.tagline)}</p>
    <div class="btns"><a class="btn p" href="#kontak">Hubungi saya</a><a class="btn" href="#proyek">Lihat proyek</a></div>
  </div>
  <img src="Hutao.gif" alt="Foto profil" style="width:400px;max-width:120%;border-radius:30px;object-fit:cover">
</section>
  <section id="tentang"><h2>Tentang</h2>
    <p class="lead" data-p="about">${esc(C.about)}</p>
    <div class="chips" style="margin-top:20px">${C.skills.map((s, i) => `<span class="chip"><span data-p="skills.${i}">${esc(s)}</span><span class="x" data-del="skills.${i}">×</span></span>`).join("")}</div>
    <button class="btn add" data-add="skills">+ Keahlian</button>
  </section>
  <section id="proyek"><h2>Proyek</h2>
    <div class="grid">${C.projects.map((p, i) => `<div class="card"><span class="tag" data-p="projects.${i}.tag">${esc(p.tag)}</span><span class="x" data-del="projects.${i}">hapus</span>
      <h3 data-p="projects.${i}.title">${esc(p.title)}</h3><p data-p="projects.${i}.desc">${esc(p.desc)}</p>
      <a href="${esc(p.link)}" target="_blank" rel="noopener" style="color:var(--ac);font-weight:600">Lihat →</a></div>`).join("")}</div>
    <button class="btn add" data-add="projects">+ Proyek</button>
  </section>
  <section id="kontak"><h2>Kontak</h2>
    <p class="lead" style="margin-top:0">Punya proyek atau ingin ngobrol? Kirim pesan, langsung masuk ke WhatsApp saya.</p>
    <div class="form" style="margin-top:18px">
      <input id="fn" placeholder="Nama Anda"><textarea id="fm" rows="3" placeholder="Pesan Anda"></textarea>
      <button class="btn p" id="send">Kirim via WhatsApp</button>
    </div>
    <div class="btns" id="lk">${links()}</div>
  </section>
  <footer>© ${new Date().getFullYear()} ${esc(C.name)}</footer>`;
  if (document.body.classList.contains("edit")) lock(true);
}

function lock(on) {
  document.querySelectorAll("[data-p]").forEach(e => on ? e.setAttribute("contenteditable", "plaintext-only") : e.removeAttribute("contenteditable"));
}

function panel() {
  const c = C.contact;
  const f = (k, l) => `<label>${l}</label><input data-c="${k}" value="${esc(c[k])}">`;
  $("#panel").innerHTML = `<b>Pengaturan</b>
    <label>Warna aksen</label><input type="color" id="ac" value="${esc(C.accent)}" style="height:40px;padding:2px">
    ${f("wa", "WhatsApp (contoh: 6281234567890)")}${f("email", "Email")}${f("instagram", "Instagram (username)")}${f("linkedin", "LinkedIn (username)")}${f("github", "GitHub (username)")}
    <label>Link proyek: klik teks proyek lalu ubah di kode, atau isi di sini</label>
    ${C.projects.map((p, i) => `<input data-l="${i}" value="${esc(p.link)}" placeholder="Link proyek ${i + 1}">`).join("")}
    <div class="btns"><button class="btn" id="exp">Salin JSON</button><button class="btn" id="rst">Reset</button></div>`;
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.p) { set(t.dataset.p, t.textContent); if (t.dataset.p === "name") $("#logo").textContent = C.name; save(); }
  else if (t.dataset.c) { C.contact[t.dataset.c] = t.value.trim(); $("#lk").innerHTML = links(); save(); }
  else if (t.dataset.l) { C.projects[t.dataset.l].link = t.value.trim(); save(); render(); }
  else if (t.id === "ac") { C.accent = t.value; document.documentElement.style.setProperty("--ac", C.accent); save(); }
});

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.del) {
    const [k, i] = t.dataset.del.split("."); C[k].splice(+i, 1); save(); render(); panel();
  } else if (t.dataset.add) {
    C[t.dataset.add].push(t.dataset.add === "skills" ? "Keahlian baru" : {tag: "TAG", title: "Proyek baru", desc: "Deskripsi proyek.", link: "#"});
    save(); render(); panel();
  } else if (t.id === "send") {
    const m = `Halo, saya ${$("#fn").value || "(tanpa nama)"}. ${$("#fm").value}`;
    window.open(`https://wa.me/${C.contact.wa}?text=${encodeURIComponent(m)}`, "_blank", "noopener");
  } else if (t.id === "ed") {
    const on = document.body.classList.toggle("edit");
    t.textContent = on ? "✓ Selesai" : "✎ Edit"; lock(on); if (on) panel();
  } else if (t.id === "th") {
    const r = document.documentElement, d = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    r.dataset.theme = d ? "light" : "dark";
  } else if (t.id === "exp") {
    const j = JSON.stringify(C, null, 2);
    try { navigator.clipboard.writeText(j); t.textContent = "Tersalin ✓"; } catch (x) { prompt("Salin JSON:", j); }
  } else if (t.id === "rst") {
    if (confirm("Kembalikan semua isi ke awal?")) { C = JSON.parse(JSON.stringify(DEFAULT)); save(); render(); panel(); }
  }
});

render();
</script>
</body>
</html>
